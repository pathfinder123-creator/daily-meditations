function listResults(list,title){$('panelTitle').textContent=title;$('panelContent').replaceChildren();if(!list.length){$('panelContent').innerHTML='<p class="muted">No meditations found.</p>';return}list.forEach(m=>{let b=document.createElement('button');b.className='result';let sm=document.createElement('small');sm.textContent=m.theme;b.append(sm,document.createTextNode(m.image&&m.reflection?m.image+' '+m.reflection:m.text));b.onclick=()=>{show(m);filtered=list;closePanel()};$('panelContent').append(b)})}function themesPanel(){$('panelTitle').textContent='Explore by theme';$('search').value='';$('panelContent').replaceChildren();themes.forEach((t,i)=>{let b=document.createElement('button');b.className='theme';let ic=document.createElement('span');ic.textContent=icons[i];b.append(ic,document.createTextNode(t));b.onclick=()=>{filtered=meditations.filter(m=>m.theme===t);show(filtered[0]);closePanel();toast(t+' · '+filtered.length+' meditations')};$('panelContent').append(b)})}function pickRandom(){let pool=meditations.filter(m=>!randomSeen.has(m.id));if(!pool.length){randomSeen.clear();pool=meditations}let m=pool[Math.floor(Math.random()*pool.length)];randomSeen.add(m.id);return m}function setNav(n){nav(n);if(n==='today'){filtered=annual;show(annual[day%366]);closePanel()}else if(n==='random'){filtered=[];show(pickRandom());closePanel()}else if(n==='themes'){themesPanel();openPanel()}else if(n==='favorites'){filtered=meditations.filter(m=>favorites.has(m.id));listResults(filtered,'Favorites');openPanel()}else{closePanel();$('quote').innerHTML='<div class="info"><div class="eyebrow">About the collection</div><h1>A little room to breathe.</h1><p>366 distinct moments of reflection across twelve themes, inviting gratitude, courage, compassion, wonder, trust, surrender and delight. Faith here is openness to the grounding mystery of existence, not a prescribed religious tradition.</p><p>Each date has a consistent meditation for everyone during the same year. In a common year, February 29’s selection remains available through browsing and Random. All meditations and scene images are packaged for offline reading.</p><p>Your favorites stay on this device. No account is needed.</p><div class="about-sharing"><h2>Share Quiet Place</h2><p>Send a meditation with its photograph, or share an invitation that includes the app link and Home Screen installation steps.</p><button class="glass" id="sharePicture">Share meditation picture</button><button class="glass" id="shareApp">Share app link</button><h2>Add to your Home Screen</h2><p><strong>Important:</strong> Use your phone browser&rsquo;s Share or menu button to install Quiet Place—not the Share button inside Quiet Place, which shares a meditation.</p><p><strong>iPhone (Safari):</strong> Open Quiet Place in Safari, tap the Share icon, choose <em>Add to Home Screen</em>, then tap <em>Add</em>.</p><p><strong>Android (Chrome):</strong> Open Quiet Place in Chrome, tap the three-dot menu, choose <em>Install app</em> or <em>Add to Home screen</em>, and follow the prompts.</p><p class="muted">Menu wording varies by phone and browser. Installing is optional; no account is required.</p></div><button class="glass" id="export">Export favorites</button><button class="glass" id="import">Restore favorites</button><input type="file" accept="application/json" id="file" hidden><p class="muted">The landscapes featured in Quiet Place are photographs of Yosemite and its surrounding wilderness, captured by hiking guide Morgan Curtin-Daniels. Her images invite us to discover moments of beauty, stillness, and wonder in the natural world.</p></div>';$('sharePicture').onclick=shareMeditationPicture;$('shareApp').onclick=shareAppLink;$('export').onclick=()=>{let b=new Blob([JSON.stringify({version:1,favorites:[...favorites]},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='daily-meditations-favorites.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.favorites))throw Error();favorites=new Set(v.favorites.filter(x=>Number.isInteger(x)&&x>=1&&x<=366));store.write('dm-favorites',[...favorites]);toast('Favorites restored')}catch{toast('Could not restore this file')}}}}$('close').onclick=closePanel;$('exit').onclick=()=>document.body.classList.remove('quiet');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setNav(b.dataset.nav));$('prev').onclick=()=>{let list=filtered.length?filtered:annual;let i=list.findIndex(x=>x.id===current?.id);show(list[(i-1+list.length)%list.length])};$('next').onclick=()=>{let list=filtered.length?filtered:annual;let i=list.findIndex(x=>x.id===current?.id);show(list[(i+1)%list.length])};$('search').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q){themesPanel();return}filtered=meditations.filter(m=>((m.image||'')+' '+(m.reflection||m.text)+' '+m.theme+' '+m.author).toLowerCase().includes(q));listResults(filtered,'Search results')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();document.body.classList.remove('quiet')}if(e.key==='ArrowRight'&&!$('panel').classList.contains('open'))$('next').click();if(e.key==='ArrowLeft'&&!$('panel').classList.contains('open'))$('prev').click()});document.addEventListener('pointerdown',e=>{if($('panel').classList.contains('open')&&!$('panel').contains(e.target)&&!e.target.closest('[data-nav="themes"]')&&!e.target.closest('[data-nav="favorites"]'))closePanel()});fetch('./meditations.json?v=quietportrait-7').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{meditations=data;annual=sequence();filtered=annual;show(annual[day%366]);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js?v=quietportrait-7').catch(()=>{})}).catch(()=>{$('quote').innerHTML='<p>Unable to load meditations. Please run this app from a web server or GitHub Pages.</p>'});
</script></body></html>
